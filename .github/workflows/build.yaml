name: build

on: [push, pull_request]

jobs:
  windows:
    runs-on: [windows-latest]
    strategy:
      matrix:
        java: [25]
        arch: [x86_64, aarch64]
    steps:
      - name: Diagnose Chrome Registry and Files
        shell: pwsh
        run: |
          Write-Host "=== 1. Check App Paths ==="
          Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe" -ErrorAction SilentlyContinue
          Get-ItemProperty "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe" -ErrorAction SilentlyContinue

          Write-Host "=== 2. Check StartMenuInternet Clients ==="
          Get-ChildItem "HKLM:\SOFTWARE\Clients\StartMenuInternet" -ErrorAction SilentlyContinue | Select-Object Name
          Get-ChildItem "HKLM:\SOFTWARE\WOW6432Node\Clients\StartMenuInternet" -ErrorAction SilentlyContinue | Select-Object Name

          Write-Host "=== 3. Check Uninstall Keys ==="
          Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*Chrome*" } | Select-Object DisplayName, UninstallString, InstallLocation
          Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*Chrome*" } | Select-Object DisplayName, UninstallString, InstallLocation

          Write-Host "=== 4. Check File System Path ==="
          Get-Command chrome.exe -ErrorAction SilentlyContinue | Select-Object Source
          Get-ChildItem "C:\Program Files\Google\Chrome\Application" -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Program Files (x86)\Google\\Chrome\Application" -ErrorAction SilentlyContinue


