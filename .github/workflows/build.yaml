name: build

on: [push, pull_request]

jobs:
  windows:
    runs-on: [windows-latest]
    strategy:
      matrix:
        java: [25]
        arch: [x86_64]
    steps:
      - name: Dump Exact Chrome Registry Paths
        shell: pwsh
        run: |
          Write-Host "=== 1. Searching Uninstall Subkeys (Registry Path + DisplayName) ==="
          $uninstallPaths = @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          foreach ($path in $uninstallPaths) {
              Get-ItemProperty $path -ErrorAction SilentlyContinue | 
                  Where-Object { $_.DisplayName -like "*Chrome*" } | 
                  Select-Object PSPath, DisplayName, DisplayVersion, UninstallString
          }

          Write-Host "=== 2. Searching StartMenuInternet Clients ==="
          $clientPaths = @(
              "HKLM:\SOFTWARE\Clients\StartMenuInternet\*",
              "HKLM:\SOFTWARE\WOW6432Node\Clients\StartMenuInternet\*",
              "HKCU:\SOFTWARE\Clients\StartMenuInternet\*"
          )
          foreach ($path in $clientPaths) {
              Get-Item $path -ErrorAction SilentlyContinue | 
                  Where-Object { $_.PSChildName -like "*Chrome*" } | 
                  Select-Object PSPath
          }

          Write-Host "=== 3. Searching App Paths ==="
          Get-Item "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe" -ErrorAction SilentlyContinue | Select-Object PSPath
          Get-Item "HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe" -ErrorAction SilentlyContinue | Select-Object PSPath


