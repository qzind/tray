<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vector Basic Color Fixture</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <svg width="500" height="500" role="img" aria-label="basic vector color blocks">
    <rect x="0" y="0" width="500" height="500" fill="red"></rect>
    <rect x="80" y="80" width="340" height="340" fill="blue"></rect>
    <rect x="170" y="170" width="160" height="160" fill="lime"></rect>
  </svg>
</body>
</html>
