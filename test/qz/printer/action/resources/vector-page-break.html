<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vector Page Break Fixture</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    .page {
      width: 300px;
      height: 180px;
      page-break-after: always;
    }

    .page:last-child {
      page-break-after: auto;
    }
  </style>
</head>
<body>
  <section class="page">
    <svg width="300" height="180" role="img" aria-label="page one red block">
      <rect x="0" y="0" width="300" height="180" fill="red"></rect>
      <text x="48" y="104" font-family="sans-serif" font-size="36" fill="white">PAGE 1</text>
    </svg>
  </section>

  <section class="page">
    <svg width="300" height="180" role="img" aria-label="page two blue block">
      <rect x="0" y="0" width="300" height="180" fill="blue"></rect>
      <text x="48" y="104" font-family="sans-serif" font-size="36" fill="white">PAGE 2</text>
    </svg>
  </section>
</body>
</html>
